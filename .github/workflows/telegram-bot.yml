name: Telegram bot

# Every 30 minutes: handle new Telegram messages (watchlist changes), and send
# the daily brief once it's due (time + timezone live in bot/data/watchlist.json).
# Scheduled workflows only run from the default branch.
on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      force_brief:
        description: "Send the daily brief now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python -m bot.main ${{ inputs.force_brief && '--force-brief' || '' }}

      - name: Save watchlist & state
        if: always()
        run: |
          if git diff --quiet -- bot/data; then
            echo "No changes to bot/data."
            exit 0
          fi
          git config user.name "tradingpal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/data
          git commit -m "bot: update watchlist/state"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
