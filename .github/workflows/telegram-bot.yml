name: Telegram bot

# Once a day: read the Telegram messages received since the last run (watchlist
# changes), then send the morning brief. Time + timezone live in
# bot/data/watchlist.json (default 08:00 Europe/Bucharest).
#
# Cron is UTC-only and GitHub may delay or silently DROP scheduled runs,
# especially at the top of the hour. So it tries several off-peak times between
# 05:07 and 07:37 UTC — covering 08:00 Bucharest in both summer (UTC+3) and
# winter (UTC+2) — and the "gate" step lets only the first due attempt do any
# work (the rest exit in seconds). Extra runs only via "Run workflow" (manual).
# Scheduled workflows only run from the default branch.
on:
  schedule:
    - cron: "7,37 5,6,7 * * *"
  workflow_dispatch:
    inputs:
      force_brief:
        description: "Send the brief now (untick to only apply watchlist changes)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Gate — is the morning brief due?
        id: gate
        if: github.event_name == 'schedule'
        run: python3 -m bot.schedule

      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.gate.outputs.due == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.gate.outputs.due == 'true'
        run: pip install -r bot/requirements.txt

      - name: Run bot
        if: github.event_name != 'schedule' || steps.gate.outputs.due == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python -m bot.main ${{ inputs.force_brief && '--force-brief' || '' }}

      - name: Save watchlist & state
        if: always() && (github.event_name != 'schedule' || steps.gate.outputs.due == 'true')
        run: |
          if git diff --quiet -- bot/data; then
            echo "No changes to bot/data."
            exit 0
          fi
          git config user.name "tradingpal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/data
          git commit -m "bot: update watchlist/state"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
